blueprint:
  name: Hue Dimmer - Adaptive Lighting + 3-Second Scene Cycle v3
  description: >-
    For Philips Hue Dimmer remotes connected through the official Hue Bridge
    integration (RWL020/RWL021/RWL022 style button numbering).

    Leave Brightness Up, Brightness Down, and Off assigned normally in the Hue
    app, but set the On button to Do nothing. Home Assistant owns the On button
    and cycles: Adaptive -> Rest -> Relax -> Bright -> Concentrate.

    Button actions trigger on initial press for lower latency. If more than the
    selected timeout passes between On-button presses, the next press restarts
    at Adaptive.

    Returning to Adaptive clears manual control and then calls
    adaptive_lighting.apply with turn_on_lights, so the current-time adaptive
    state is applied immediately whether the room was off or already on. This is
    deterministic and does not rely on a bare light.turn_on being intercepted in
    time. The fade duration uses the Adaptive transition input; color mode still
    follows the instance's own settings such as prefer_rgb_color.

    Brightness buttons end the cycle window and mark only brightness as manually
    controlled, allowing Adaptive Lighting to continue adapting color. Off ends
    the cycle and resets the helper to Adaptive; the Hue Bridge performs the
    actual Off action.

    Before creating an automation from this blueprint, create one Dropdown helper
    per room with these options in this exact order and capitalization:
    Adaptive, Rest, Relax, Bright, Concentrate. Also create one Timer helper per room.

    Requires Adaptive Lighting with selective brightness/color manual control
    support (Adaptive Lighting 1.30.0 or newer) and take_over_control enabled on
    each instance, which set_manual_control depends on.
  domain: automation
  author: OpenAI for Ralph
  homeassistant:
    min_version: 2024.6.0

  input:
    required:
      name: Required room settings
      icon: mdi:lightbulb-group
      input:
        hue_remote:
          name: Hue Dimmer remote
          description: Select the Hue Dimmer remote paired to the official Hue Bridge integration.
          selector:
            device:
              filter:
                - integration: hue

        room_light:
          name: Hue room or zone light
          description: Select the grouped Hue room/zone light used by this room's Adaptive Lighting instance.
          selector:
            entity:
              filter:
                - domain: light

        adaptive_switch:
          name: Adaptive Lighting instance
          description: Select the main switch for this room, such as switch.adaptive_lighting_living_room.
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting

        mode_helper:
          name: Lighting mode Dropdown helper
          description: Must contain Adaptive, Rest, Relax, Bright, Concentrate in that exact order.
          selector:
            entity:
              filter:
                - domain: input_select

        cycle_timer:
          name: Scene-cycle Timer helper
          description: A separate Timer helper for this room. Its configured default duration does not matter.
          selector:
            entity:
              filter:
                - domain: timer

    scenes:
      name: Hue scenes
      icon: mdi:palette
      input:
        rest_scene:
          name: Rest scene
          selector:
            entity:
              filter:
                - domain: scene

        relax_scene:
          name: Relax scene
          selector:
            entity:
              filter:
                - domain: scene

        bright_scene:
          name: Bright scene
          selector:
            entity:
              filter:
                - domain: scene

        concentrate_scene:
          name: Concentrate scene
          selector:
            entity:
              filter:
                - domain: scene

    behavior:
      name: Timing
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        cycle_timeout:
          name: On-button cycle timeout
          description: Time allowed between On-button presses before the next press restarts at Adaptive.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              unit_of_measurement: seconds
              mode: slider

        adaptive_transition:
          name: Adaptive transition
          description: >-
            Fade duration used when returning to Adaptive mode, whether the room
            was off or already on. Set this to match your Adaptive Lighting
            instance's initial_transition if you want the fade to feel identical
            to a normal Adaptive Lighting turn-on.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

mode: queued
max: 10
max_exceeded: silent

variables:
  room_light: !input room_light
  adaptive_switch: !input adaptive_switch
  mode_helper: !input mode_helper
  cycle_timer: !input cycle_timer
  rest_scene: !input rest_scene
  relax_scene: !input relax_scene
  bright_scene: !input bright_scene
  concentrate_scene: !input concentrate_scene
  cycle_timeout: !input cycle_timeout
  adaptive_transition: !input adaptive_transition

triggers:
  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 1
    id: on_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 2
    id: brightness_up_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 3
    id: brightness_down_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 4
    id: off_press

conditions: []

actions:
  - choose:
      # ON: restart at Adaptive after the timeout, otherwise advance the cycle.
      - conditions:
          - condition: trigger
            id: on_press
        sequence:
          - variables:
              cycle_was_active: "{{ is_state(cycle_timer, 'active') }}"
              room_was_off: "{{ is_state(room_light, 'off') }}"
              adaptive_was_on: "{{ is_state(adaptive_switch, 'on') }}"

          - action: timer.start
            target:
              entity_id: "{{ cycle_timer }}"
            data:
              duration: "{{ cycle_timeout | int(3) }}"

          # Decide which mode this press selects.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ room_was_off or not cycle_was_active }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: "{{ mode_helper }}"
                    data:
                      option: Adaptive
            default:
              - action: input_select.select_next
                target:
                  entity_id: "{{ mode_helper }}"
                data:
                  cycle: true

          # Apply the selected mode.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Adaptive') }}"
                sequence:
                  # Make sure the Adaptive Lighting instance is running. The short
                  # settle delay is applied only in this uncommon path (AL was
                  # off) so the normal case stays fast. It gives AL a moment to
                  # register before the apply call below.
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not adaptive_was_on }}"
                        sequence:
                          - action: switch.turn_on
                            target:
                              entity_id: "{{ adaptive_switch }}"
                          - delay:
                              milliseconds: 100

                  # Clear any manual-control flags left by a scene or a brightness
                  # press so interval adaptation resumes afterward.
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: false

                  # Force the CURRENT-time adaptive state directly rather than
                  # relying on a bare light.turn_on being intercepted in time.
                  # turn_on_lights handles the room-was-off case; if the room is
                  # already on this just re-adapts it. apply ignores the manual
                  # flag, so the look is correct even if the clear above is still
                  # settling. This is what stops the room coming on at a stale look.
                  - action: adaptive_lighting.apply
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      turn_on_lights: true
                      transition: "{{ adaptive_transition | float(1) }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Rest') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ rest_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Relax') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ relax_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Bright') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ bright_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Concentrate') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ concentrate_scene }}"

      # BRIGHTNESS +/-: Hue performs native dimming. HA immediately ends the
      # scene-cycle window and pauses only brightness adaptation.
      - conditions:
          - condition: trigger
            id:
              - brightness_up_press
              - brightness_down_press
        sequence:
          - action: timer.cancel
            target:
              entity_id: "{{ cycle_timer }}"

          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: "{{ adaptive_switch }}"
              lights: "{{ [room_light] }}"
              manual_control: brightness

      # OFF: Hue performs the native Off action. HA only resets bookkeeping.
      # Do not clear manual control here, because doing so while HA still reports
      # the light as on would cause an unnecessary adaptation immediately before Off.
      - conditions:
          - condition: trigger
            id: off_press
        sequence:
          - action: timer.cancel
            target:
              entity_id: "{{ cycle_timer }}"

          - action: input_select.select_option
            target:
              entity_id: "{{ mode_helper }}"
            data:
              option: Adaptive
