blueprint:
  name: Hue Dimmer - Adaptive Lighting + 3-Second Scene Cycle v3
  description: >-
    For Philips Hue Dimmer remotes connected through the official Hue Bridge
    integration (RWL020/RWL021/RWL022 style button numbering).

    Leave Brightness Up, Brightness Down, and Off assigned normally in the Hue
    app, but set the On button to Do nothing. Home Assistant owns the On button
    and cycles: Adaptive -> Rest -> Relax -> Bright -> Concentrate.

    Button actions trigger on initial press for lower latency. If more than the
    selected timeout passes between On-button presses, the next press restarts
    at Adaptive.

    Returning to Adaptive uses the selected Adaptive Lighting instance's own
    settings, including initial_transition and prefer_rgb_color. It intentionally
    avoids calling adaptive_lighting.apply after clearing manual control, because
    clearing manual control already reapplies Adaptive Lighting.

    Brightness buttons end the cycle window and mark only brightness as manually
    controlled, allowing Adaptive Lighting to continue adapting color. Off ends
    the cycle and resets the helper to Adaptive; the Hue Bridge performs the
    actual Off action.

    Before creating an automation from this blueprint, create one Dropdown helper
    per room with these options in this exact order and capitalization:
    Adaptive, Rest, Relax, Bright, Concentrate. Also create one Timer helper per room.

    Requires Adaptive Lighting with selective brightness/color manual control
    support (Adaptive Lighting 1.30.0 or newer).
  domain: automation
  author: OpenAI for Ralph
  homeassistant:
    min_version: 2024.6.0

  input:
    required:
      name: Required room settings
      icon: mdi:lightbulb-group
      input:
        hue_remote:
          name: Hue Dimmer remote
          description: Select the Hue Dimmer remote paired to the official Hue Bridge integration.
          selector:
            device:
              filter:
                - integration: hue

        room_light:
          name: Hue room or zone light
          description: Select the grouped Hue room/zone light used by this room's Adaptive Lighting instance.
          selector:
            entity:
              filter:
                - domain: light

        adaptive_switch:
          name: Adaptive Lighting instance
          description: Select the main switch for this room, such as switch.adaptive_lighting_living_room.
          selector:
            entity:
              filter:
                - domain: switch
                  integration: adaptive_lighting

        mode_helper:
          name: Lighting mode Dropdown helper
          description: Must contain Adaptive, Rest, Relax, Bright, Concentrate in that exact order.
          selector:
            entity:
              filter:
                - domain: input_select

        cycle_timer:
          name: Scene-cycle Timer helper
          description: A separate Timer helper for this room. Its configured default duration does not matter.
          selector:
            entity:
              filter:
                - domain: timer

    scenes:
      name: Hue scenes
      icon: mdi:palette
      input:
        rest_scene:
          name: Rest scene
          selector:
            entity:
              filter:
                - domain: scene

        relax_scene:
          name: Relax scene
          selector:
            entity:
              filter:
                - domain: scene

        bright_scene:
          name: Bright scene
          selector:
            entity:
              filter:
                - domain: scene

        concentrate_scene:
          name: Concentrate scene
          selector:
            entity:
              filter:
                - domain: scene

    behavior:
      name: Timing
      icon: mdi:timer-cog-outline
      collapsed: true
      input:
        cycle_timeout:
          name: On-button cycle timeout
          description: Time allowed between On-button presses before the next press restarts at Adaptive.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              unit_of_measurement: seconds
              mode: slider

        adaptive_transition:
          name: Legacy adaptive transition — ignored
          description: >-
            Kept only so existing automations made from v2 remain compatible.
            Adaptive mode now uses the selected Adaptive Lighting instance's own
            initial_transition setting.
          default: 1
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: seconds
              mode: slider

mode: queued
max: 10
max_exceeded: silent

variables:
  room_light: !input room_light
  adaptive_switch: !input adaptive_switch
  mode_helper: !input mode_helper
  cycle_timer: !input cycle_timer
  rest_scene: !input rest_scene
  relax_scene: !input relax_scene
  bright_scene: !input bright_scene
  concentrate_scene: !input concentrate_scene
  cycle_timeout: !input cycle_timeout

triggers:
  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 1
    id: on_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 2
    id: brightness_up_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 3
    id: brightness_down_press

  - trigger: device
    device_id: !input hue_remote
    domain: hue
    type: initial_press
    subtype: 4
    id: off_press

conditions: []

actions:
  - choose:
      # ON: restart at Adaptive after the timeout, otherwise advance the cycle.
      - conditions:
          - condition: trigger
            id: on_press
        sequence:
          - variables:
              cycle_was_active: "{{ is_state(cycle_timer, 'active') }}"
              room_was_off: "{{ is_state(room_light, 'off') }}"
              adaptive_was_on: "{{ is_state(adaptive_switch, 'on') }}"

          - action: timer.start
            target:
              entity_id: "{{ cycle_timer }}"
            data:
              duration: "{{ cycle_timeout | int(3) }}"

          # Decide which mode this press selects.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ room_was_off or not cycle_was_active }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: "{{ mode_helper }}"
                    data:
                      option: Adaptive
            default:
              - action: input_select.select_next
                target:
                  entity_id: "{{ mode_helper }}"
                data:
                  cycle: true

          # Apply the selected mode.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Adaptive') }}"
                sequence:
                  # If the Adaptive Lighting instance was off, turning it on resets
                  # manual control and adapts lights that are already on.
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not adaptive_was_on }}"
                        sequence:
                          - action: switch.turn_on
                            target:
                              entity_id: "{{ adaptive_switch }}"

                  # If the room was off, clear any stale manual state (when needed)
                  # and use a bare turn-on. Adaptive Lighting intercepts it and
                  # supplies this instance's own brightness, color, RGB preference,
                  # and initial transition.
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ room_was_off }}"
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ adaptive_was_on }}"
                                sequence:
                                  - action: adaptive_lighting.set_manual_control
                                    data:
                                      entity_id: "{{ adaptive_switch }}"
                                      lights: "{{ [room_light] }}"
                                      manual_control: false

                          - action: light.turn_on
                            target:
                              entity_id: "{{ room_light }}"

                    # If the room was already on and Adaptive Lighting was already
                    # enabled, clearing manual control itself immediately reapplies
                    # the instance's current adaptive settings.
                    default:
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ adaptive_was_on }}"
                            sequence:
                              - action: adaptive_lighting.set_manual_control
                                data:
                                  entity_id: "{{ adaptive_switch }}"
                                  lights: "{{ [room_light] }}"
                                  manual_control: false

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Rest') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ rest_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Relax') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ relax_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Bright') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ bright_scene }}"

              - conditions:
                  - condition: template
                    value_template: "{{ is_state(mode_helper, 'Concentrate') }}"
                sequence:
                  - action: adaptive_lighting.set_manual_control
                    data:
                      entity_id: "{{ adaptive_switch }}"
                      lights: "{{ [room_light] }}"
                      manual_control: true

                  - action: scene.turn_on
                    target:
                      entity_id: "{{ concentrate_scene }}"

      # BRIGHTNESS +/-: Hue performs native dimming. HA immediately ends the
      # scene-cycle window and pauses only brightness adaptation.
      - conditions:
          - condition: trigger
            id:
              - brightness_up_press
              - brightness_down_press
        sequence:
          - action: timer.cancel
            target:
              entity_id: "{{ cycle_timer }}"

          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: "{{ adaptive_switch }}"
              lights: "{{ [room_light] }}"
              manual_control: brightness

      # OFF: Hue performs the native Off action. HA only resets bookkeeping.
      # Do not clear manual control here, because doing so while HA still reports
      # the light as on would cause an unnecessary adaptation immediately before Off.
      - conditions:
          - condition: trigger
            id: off_press
        sequence:
          - action: timer.cancel
            target:
              entity_id: "{{ cycle_timer }}"

          - action: input_select.select_option
            target:
              entity_id: "{{ mode_helper }}"
            data:
              option: Adaptive
